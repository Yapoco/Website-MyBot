<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyBotLifeNiceFree</title>
  <link rel="stylesheet" href="styles.css" />
  <script defer src="script.js"></script>
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/5968/5968756.png">
</head>
<body>
  <header>
    <div class="logo">
      <img src="https://cdn-icons-png.flaticon.com/512/5968/5968756.png" alt="Discord Logo">
      <h1 class="title-animate">MyBotLifeNiceFree</h1>
    </div>
    <nav>
      <button id="commandsBtn">Comandos</button>
      <button id="inviteSmall">Invitar Bot</button>
      <button id="settingsBtn">Ajustes</button>
    </nav>
  </header>

  <main>
    <canvas id="background-circles"></canvas>
    <section class="intro">
      <h2>Bienvenido a <span class="glow">MyBotLifeNiceFree</span></h2>
      <p>El bot de moderación y registros más confiable y completo de habla hispana.</p>
      <a class="invite-btn" href="https://discord.com/oauth2/authorize?client_id=1355394034494869584" target="_blank">
        <img src="https://cdn-icons-png.flaticon.com/512/5968/5968756.png" alt="Discord" />
        Invitar Bot
      </a>
    </section>
    <section id="scene"></section>
  </main>

  <footer>
    <p>&copy; 2025 MyBotLifeNiceFree</p>
  </footer>
</body>
</html>
