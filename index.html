<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MybotLifeNiceFree</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to right, #0f0f0f, #1e1e1e);
      color: #d9ffd9;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    header {
      width: 100%;
      background-color: #0e0e0e;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    header img {
      width: 100%;
      max-height: 200px;
      object-fit: cover;
    }
    h1 {
      margin-top: 20px;
      color: #66ff66;
    }
    .commands {
      background-color: #1f1f1f;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 10px #00ff88;
      max-width: 400px;
      margin: 20px;
    }
    .commands h2 {
      color: #00ff88;
      margin-bottom: 10px;
    }
    .commands ul {
      list-style: none;
      padding-left: 0;
    }
    .commands li {
      padding: 5px 0;
    }
    .invite-button {
      background-color: #00ff88;
      color: #000;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin: 20px;
      text-decoration: none;
    }
    .invite-button:hover {
      background-color: #33ff99;
    }
    footer {
      margin-top: auto;
      padding: 10px;
      color: #888;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <header>
    <img src="Proyecto nuevo (6).png" alt="Banner de MybotLifeNiceFree" />
  </header>
  <h1>MybotLifeNiceFree</h1>
  <div class="commands">
    <h2>Comandos</h2>
    <ul>
      <li>/help</li>
      <li>/ping</li>
      <li>/mcommandshelp</li>
    </ul>
  </div>
  <a href="https://discord.com/oauth2/authorize?client_id=1355394034494869584" class="invite-button" target="_blank">Invitar Bot</a>
  <footer>
    &copy; 2025 MybotLifeNiceFree. Sitio hecho con amor 💚
  </footer>
</body>
</html>
